# example-docker.yaml — kcb configuration for builds in a local Docker container.
# Copy to ~/.kcb/config.yaml and adjust as needed.
# Requires a working local Docker daemon.

provider:
  type: docker
  image: ubuntu:24.04         # Base image used for the build container.
  container_name: kcb-build   # Optional. Remove to let kcb generate a unique name.
  ssh_key_path: ~/.ssh/id_rsa
  arch: x86_64                # Native architecture inside the container: x86_64 or arm64.
                              # Controls cross-toolchain selection.

# What to build. Remove or comment out entries to skip that component.
components:
  - kernel
  - rootfs
  - syzkaller

kernel:
  # Option A: clone from git (default)
  git_url: https://github.com/torvalds/linux.git
  branch: master

  # Option B: download a tarball — mutually exclusive with branch
  # tarball_url: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.9.tar.xz

  # Architectures to build. Produces bzImage + vmlinux (x86_64) or Image + vmlinux (arm64).
  targets:
    - x86_64
    - arm64

  # Config overlays: applied in order after defconfig; later entries win.
  # config_overlays:
  #   - configs/kernel-overlays/fuzzing.config
  #   - configs/kernel-overlays/ksmbd.config

rootfs:
  version: "2024.02"    # Buildroot release version
  targets:
    - x86_64
    - arm64

  # Config fragments: applied in order after defconfig; later entries win.
  # config_fragments:
  #   - configs/rootfs-fragments/ksmbd.config
  #   - configs/rootfs-fragments/devtools.config

syzkaller:
  # Target OS/arch pairs for syzkaller binaries (kernel-side tools).
  targets:
    - amd64
    - arm64

  # host_os: which OS(es) to compile host tools (syz-manager, syz-repro, etc.) for.
  # "linux"  → HOSTOS=linux binaries, staged to host_{arch}/
  # "macos"  → cross-compiles HOSTOS=darwin binaries, staged to host_darwin_{arch}/
  host_os:
    - linux
    # - macos

output_dir: ./kernel-builds    # Local directory to download artifacts into. Default: ./kcb-artifacts

# Keep the container alive when a build step fails (default: destroy on failure).
# kcb prints a docker exec command so you can inspect the failed environment.
keep_on_failure: false
